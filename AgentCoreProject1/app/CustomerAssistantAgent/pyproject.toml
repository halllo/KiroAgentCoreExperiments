[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "CustomerAssistantAgent"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore[strands-agents] >= 1.18.1",
    "botocore[crt] >= 1.35.0",
    "mcp >= 1.28.1, < 2.0.0",
    "strands-agents >= 1.15.0",
    # Provides the built-in current_time tool. Capped below 0.9.0 because
    # current_time is deprecated in 0.8.x and its warning escalates in 0.9.0.
    "strands-agents-tools >= 0.8.9, < 0.9.0",
    
]

[tool.hatch.build.targets.wheel]
packages = ["."]
